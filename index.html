<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#02040a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JARVIS">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./style.css">
  <title>JARVIS — Personal Intelligence System</title>
</head>
<body>
  <canvas id="neuralCanvas" aria-hidden="true"></canvas>
  <div class="grid"></div>
  <div class="vignette"></div>

  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-core"><span></span></div>
        <div>
          <div class="brand-title">J.A.R.V.I.S.</div>
          <div class="brand-subtitle">PERSONAL INTELLIGENCE SYSTEM</div>
        </div>
      </div>
      <div class="status"><span class="status-dot"></span><span id="statusText">ONLINE</span></div>
    </header>

    <section class="hero">
      <div class="reactor" id="reactor" aria-label="JARVIS status">
        <div class="reactor-halo"></div>
        <div class="reactor-core"></div>
        <div class="reactor-ring r1"></div>
        <div class="reactor-ring r2"></div>
        <div class="reactor-ring r3"></div>
        <div class="reactor-pulse"></div>
        <div class="reactor-scan"></div>
      </div>

      <div class="state-label" id="stateLabel">STANDBY</div>
      <h1>Good evening.</h1>
      <p>Come posso assisterti?</p>

      <div class="chips">
        <button data-prompt="Cosa puoi fare?">Capacità</button>
        <button data-prompt="Cosa ho in calendario oggi?">Calendario</button>
        <button data-prompt="Creami un piano di studio per oggi considerando i file che ho caricato.">Piano di studio</button>
      </div>
    </section>

    <section class="conversation" id="conversation" aria-live="polite">
      <article class="message jarvis">
        <div class="avatar">J</div>
        <div>
          <div class="label">JARVIS</div>
          <div class="bubble">Buonasera. Sono JARVIS NEXUS. Il sistema è pronto.</div>
        </div>
      </article>
    </section>

    <section class="composer">
      <div class="input-shell">
        <textarea id="input" rows="1" placeholder="Parla o scrivi a JARVIS…" autocomplete="off"></textarea>
        <button class="mic" id="mic" aria-label="Attiva microfono">◉</button>
        <button class="send" id="send" aria-label="Invia">↑</button>
      </div>
      <div class="hint">Microfono: tocca per parlare • JARVIS risponde con voce quando disponibile</div>
    </section>

    <footer>
      <span>NEXUS CORE</span><span>•</span><span>VOICE</span><span>•</span><span>CALENDAR READY</span><span>•</span><span>FILE READY</span>
    </footer>
  </main>

  <script src="./app.js"></script>
</body>
</html>
